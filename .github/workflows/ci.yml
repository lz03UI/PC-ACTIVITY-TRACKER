name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: Cross-platform build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore PcActivityTracker.CrossPlatform.sln --locked-mode
      - name: Check formatting
        run: dotnet format PcActivityTracker.CrossPlatform.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build PcActivityTracker.CrossPlatform.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test PcActivityTracker.CrossPlatform.sln --configuration Release --no-build --logger "trx;LogFileName=cross-platform.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-platform-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  windows:
    name: Full Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore PcActivityTracker.sln --locked-mode
      - name: Build
        run: dotnet build PcActivityTracker.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test PcActivityTracker.sln --configuration Release --no-build --logger "trx;LogFileName=windows.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
